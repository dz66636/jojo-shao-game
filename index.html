<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>殴打王锴 〜JOJO的奇妙冒险〜</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0d0217; font-family:"Noto Serif JP","STKaiti",serif; user-select:none; }
  #stage { position:fixed; inset:0; cursor:crosshair; overflow:hidden; }
  #stage.shake { animation:shake .15s linear; }
  #stage.shake-hard { animation:shakeHard .3s linear; }
  @keyframes shake {
    0%{transform:translate(0,0)} 25%{transform:translate(-8px,5px)}
    50%{transform:translate(7px,-6px)} 75%{transform:translate(-5px,-4px)} 100%{transform:translate(0,0)}
  }
  @keyframes shakeHard {
    0%{transform:translate(0,0) rotate(0)} 20%{transform:translate(-18px,10px) rotate(-1deg)}
    40%{transform:translate(15px,-12px) rotate(1deg)} 60%{transform:translate(-12px,-8px) rotate(-.5deg)}
    80%{transform:translate(10px,6px) rotate(.5deg)} 100%{transform:translate(0,0) rotate(0)}
  }
  #bg { position:absolute; inset:0; background:url("https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=JoJo%27s%20Bizarre%20Adventure%20style%20dramatic%20dark%20night%20scene%2C%20deep%20purple%20gradient%20sky%2C%20huge%20glowing%20full%20moon%2C%20radiating%20manga%20speed%20lines%20from%20center%2C%20menacing%20atmosphere%2C%20bold%20high%20contrast%20anime%20background%20art&image_size=landscape_16_9") center/cover no-repeat; opacity:.85; }
  #vignette { position:absolute; inset:0; background:radial-gradient(ellipse at center, transparent 40%, rgba(10,0,25,.9) 100%); }

  /* ── 标题 ── */
  #title { position:absolute; top:4%; width:100%; text-align:center; z-index:5; pointer-events:none; }
  #title h1 { font-size:clamp(34px,7vw,72px); font-weight:900; letter-spacing:.08em;
    background:linear-gradient(180deg,#ffe95e 20%,#ff9d00 55%,#ff2d78 90%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(3px 3px 0 #2a004d) drop-shadow(-2px -2px 0 #2a004d) drop-shadow(0 0 22px rgba(255,45,120,.6));
    transform:skew(-6deg); }
  #title .sub { margin-top:6px; font-size:clamp(13px,2.2vw,20px); color:#c9a7ff; letter-spacing:.5em; text-shadow:0 0 10px #7b2dff; }

  /* ── 王锴 ── */
  #shao-wrap { position:absolute; left:50%; top:55%; transform:translate(-50%,-50%); z-index:3; }
  #shao-frame { position:relative; width:min(46vmin,420px); height:min(62vmin,560px);
    border:5px solid #ffd400; outline:4px solid #1a0033;
    box-shadow:0 0 40px rgba(255,212,0,.45), inset 0 0 30px rgba(0,0,0,.6);
    background:#1a0033; overflow:hidden; transform:rotate(-2deg); }
  #shao-frame::after { content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(45deg, transparent 0 14px, rgba(255,255,255,.04) 14px 16px); pointer-events:none; }
  #shao-frame img { width:100%; height:100%; object-fit:cover; display:block; }
  #shao-frame.hurt img { animation:hurtFlash .15s linear; }
  #shao-frame.hurt { animation:hurtJitter .12s linear; }
  @keyframes hurtFlash {
    0%{filter:none} 40%{filter:brightness(2.2) contrast(1.4) saturate(.3) hue-rotate(-30deg)} 100%{filter:none}
  }
  @keyframes hurtJitter {
    0%{transform:rotate(-2deg) translate(0,0)} 30%{transform:rotate(-4deg) translate(-10px,4px)}
    60%{transform:rotate(0deg) translate(9px,-5px)} 100%{transform:rotate(-2deg) translate(0,0)}
  }
  #shao-frame.dead img { filter:grayscale(1) brightness(.6) contrast(1.3); }
  #shao-frame.dead { animation:deadTilt 1s ease both; }
  @keyframes deadTilt { 0%{transform:rotate(-2deg)} 100%{transform:rotate(6deg) translateY(10px)} }
  #menacing { position:absolute; top:-12%; left:50%; transform:translateX(-50%); font-size:clamp(24px,5vw,44px);
    color:#b26bff; text-shadow:0 0 14px #7b2dff, 2px 2px 0 #000; letter-spacing:.15em; white-space:nowrap;
    animation:floaty 2.4s ease-in-out infinite; pointer-events:none; }
  @keyframes floaty { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(-10px)} }

  /* ── HP 条 ── */
  #hp-wrap { position:absolute; top:17%; left:50%; transform:translateX(-50%) skew(-10deg); width:min(70vw,560px); z-index:5; pointer-events:none; }
  #hp-label { color:#ffd400; font-size:clamp(14px,2.4vw,20px); font-weight:900; text-shadow:2px 2px 0 #000; margin-bottom:4px; letter-spacing:.2em; }
  #hp-bar { height:22px; border:3px solid #ffd400; background:#20003d; box-shadow:0 0 16px rgba(255,212,0,.5); }
  #hp-fill { height:100%; width:100%; background:linear-gradient(90deg,#ff2d78,#ff9d00,#ffe95e); transition:width .12s; }

  /* ── 计分 ── */
  #stats { position:absolute; top:2%; left:2.5%; z-index:5; color:#fff; pointer-events:none; text-shadow:2px 2px 0 #000; }
  #stats .num { color:#ffe95e; font-size:clamp(22px,4vw,36px); font-weight:900; }
  #stats .lbl { color:#c9a7ff; font-size:clamp(11px,1.6vw,14px); letter-spacing:.3em; }
  #combo { position:absolute; top:2%; right:2.5%; z-index:5; text-align:right; pointer-events:none; opacity:0; transition:opacity .2s; }
  #combo.show { opacity:1; }
  #combo .num { font-size:clamp(40px,9vw,90px); font-weight:900; color:#ff2d78; transform:skew(-8deg); display:inline-block;
    text-shadow:3px 3px 0 #000, 0 0 24px rgba(255,45,120,.8); }
  #combo .lbl { color:#ffe95e; font-weight:900; letter-spacing:.2em; text-shadow:2px 2px 0 #000; }

  /* ── 特效层 ── */
  .impact { position:absolute; width:150px; height:150px; z-index:8; pointer-events:none;
    transform:translate(-50%,-50%) scale(.3); animation:impactPop .35s ease-out forwards; }
  @keyframes impactPop {
    0%{transform:translate(-50%,-50%) scale(.2) rotate(0); opacity:1}
    60%{transform:translate(-50%,-50%) scale(1.15) rotate(12deg); opacity:1}
    100%{transform:translate(-50%,-50%) scale(1.4) rotate(20deg); opacity:0}
  }
  .sfx-text { position:absolute; z-index:9; pointer-events:none; font-weight:900; white-space:nowrap;
    transform:translate(-50%,-50%) rotate(var(--rot)) scale(.3); animation:sfxPop .6s cubic-bezier(.2,1.6,.4,1) forwards; }
  @keyframes sfxPop {
    0%{transform:translate(-50%,-50%) rotate(var(--rot)) scale(.2); opacity:0}
    30%{opacity:1}
    100%{transform:translate(-50%,-50%) rotate(var(--rot)) scale(1.15) translateY(-40px); opacity:0}
  }
  #rush-banner { position:absolute; top:36%; width:100%; text-align:center; z-index:10; pointer-events:none; display:none; }
  #rush-banner.show { display:block; }
  #rush-banner span { display:inline-block; font-size:clamp(46px,11vw,120px); font-weight:900; letter-spacing:.05em;
    color:#ffe95e; transform:skew(-10deg);
    text-shadow:4px 4px 0 #ff2d78, 8px 8px 0 #000, 0 0 40px rgba(255,233,94,.9);
    animation:rushPulse .18s linear infinite; }
  @keyframes rushPulse { 0%,100%{transform:skew(-10deg) scale(1)} 50%{transform:skew(-10deg) scale(1.08)} }
  .flash { position:absolute; inset:0; background:#fff; z-index:7; pointer-events:none; opacity:0; }
  .flash.go { animation:flashGo .18s ease-out; }
  @keyframes flashGo { 0%{opacity:.75} 100%{opacity:0} }

  /* ── KO ── */
  #ko { position:absolute; inset:0; z-index:20; display:none; align-items:center; justify-content:center; flex-direction:column; background:rgba(10,0,25,.55); }
  #ko.show { display:flex; }
  #ko h2 { font-size:clamp(40px,9vw,100px); font-weight:900; color:#fff; letter-spacing:.1em; transform:skew(-6deg);
    text-shadow:4px 4px 0 #ff2d78, 8px 8px 0 #000; animation:koDrop .5s cubic-bezier(.2,1.8,.4,1) both; }
  #ko p { margin-top:14px; color:#c9a7ff; font-size:clamp(15px,2.6vw,24px); letter-spacing:.4em; text-shadow:2px 2px 0 #000; }
  @keyframes koDrop { 0%{transform:skew(-6deg) scale(3); opacity:0} 100%{transform:skew(-6deg) scale(1); opacity:1} }
  #retry { margin-top:34px; padding:12px 44px; font-size:clamp(16px,3vw,24px); font-weight:900; font-family:inherit;
    color:#1a0033; background:linear-gradient(180deg,#ffe95e,#ff9d00); border:3px solid #000; cursor:pointer;
    transform:skew(-8deg); box-shadow:5px 5px 0 #ff2d78; letter-spacing:.2em; }
  #retry:active { transform:skew(-8deg) translate(3px,3px); box-shadow:2px 2px 0 #ff2d78; }
  #tbc { position:absolute; right:4%; bottom:5%; z-index:21; display:none; align-items:center; pointer-events:none; }
  #tbc.show { display:flex; animation:tbcIn 1.2s ease both .8s; }
  @keyframes tbcIn { 0%{transform:translateX(120%)} 100%{transform:translateX(0)} }
  #tbc .arrow { font-size:clamp(20px,4vw,38px); color:#fff; font-family:Georgia,serif; font-style:italic;
    text-shadow:2px 2px 0 #000; }
  #tbc .tri { width:0; height:0; margin-left:10px; border-top:16px solid transparent; border-bottom:16px solid transparent; border-left:26px solid #ffd400; filter:drop-shadow(2px 2px 0 #000); }
  body.sepia #stage { filter:sepia(.8) saturate(.6); }
  #hint { position:absolute; bottom:3.5%; width:100%; text-align:center; z-index:5; color:#c9a7ff;
    font-size:clamp(12px,2vw,17px); letter-spacing:.35em; text-shadow:0 0 8px #7b2dff; pointer-events:none;
    animation:hintBlink 1.6s ease-in-out infinite; }
  @keyframes hintBlink { 0%,100%{opacity:.4} 50%{opacity:1} }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="vignette"></div>

  <div id="title">
    <h1>殴打王锴</h1>
    <div class="sub">JOJO的奇妙冒险 ・ オラオラの拳</div>
  </div>

  <div id="hp-wrap">
    <div id="hp-label">王锴 ・ WANGKAI'S HP</div>
    <div id="hp-bar"><div id="hp-fill"></div></div>
  </div>

  <div id="stats">
    <div class="num" id="hit-num">0</div>
    <div class="lbl">总拳击数 HITS</div>
  </div>
  <div id="combo"><span class="num" id="combo-num">0</span><div class="lbl">连击 COMBO</div></div>

  <div id="shao-wrap">
    <div id="menacing">ゴゴゴゴゴ</div>
    <div id="shao-frame">
      <img id="shao-img" alt="王锴" src="shao.jpg">
    </div>
  </div>

  <div id="rush-banner"><span>オラオラオラオラ！！</span></div>
  <div class="flash" id="flash"></div>
  <div id="hint">— 点击屏幕 出拳殴打 —</div>
</div>

<div id="ko">
  <h2>王锴・再起不能</h2>
  <p>RETIRED ・ 完全败北</p>
  <button id="retry">再戦する</button>
</div>
<div id="tbc"><span class="arrow">To Be Continued</span><span class="tri"></span></div>

<script>
(function(){
  var stage=document.getElementById('stage'), frame=document.getElementById('shao-frame'),
      hpFill=document.getElementById('hp-fill'), hitNum=document.getElementById('hit-num'),
      comboBox=document.getElementById('combo'), comboNum=document.getElementById('combo-num'),
      rush=document.getElementById('rush-banner'), flash=document.getElementById('flash'),
      ko=document.getElementById('ko'), tbc=document.getElementById('tbc'),
      retry=document.getElementById('retry'), hint=document.getElementById('hint');

  var HP=100, hits=0, combo=0, comboTimer=null, lastHit=0, dead=false;
  var SFX=['オラッ!','無駄ッ!','ドゴォ!','バキッ!','ズギュン!','ドゴォォ!','オラオラ!','メキッ!'];
  var COLORS=['#ffe95e','#ff2d78','#7b2dff','#4de3ff','#ff9d00'];

  // ── 音效（WebAudio 合成拳击声）──
  var AC=null;
  function audio(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
  function punchSound(deep){
    var ac=audio(); if(!ac) return;
    var t=ac.currentTime;
    var o=ac.createOscillator(), g=ac.createGain();
    o.type='sine'; o.frequency.setValueAtTime(deep?70:150,t);
    o.frequency.exponentialRampToValueAtTime(40,t+.12);
    g.gain.setValueAtTime(.5,t); g.gain.exponentialRampToValueAtTime(.001,t+.15);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+.16);
    var len=ac.sampleRate*.08, buf=ac.createBuffer(1,len,ac.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    var n=ac.createBufferSource(); n.buffer=buf;
    var ng=ac.createGain(); ng.gain.setValueAtTime(.35,t); ng.gain.exponentialRampToValueAtTime(.001,t+.08);
    n.connect(ng); ng.connect(ac.destination); n.start(t);
  }

  function spawnImpact(x,y,big){
    var s=document.createElementNS('http://www.w3.org/2000/svg','svg');
    s.setAttribute('viewBox','0 0 100 100'); s.classList.add('impact');
    if(big){ s.style.width='230px'; s.style.height='230px'; }
    s.style.left=x+'px'; s.style.top=y+'px';
    var pts=[], cx=50, cy=50;
    for(var i=0;i<16;i++){
      var r=i%2===0?48:18, a=Math.PI*2*i/16 - Math.PI/2;
      pts.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1));
    }
    s.innerHTML='<polygon points="'+pts.join(' ')+'" fill="'+(big?'#ff2d78':'#ffe95e')+'" stroke="#000" stroke-width="3"/>'+
                '<circle cx="50" cy="50" r="10" fill="#fff" stroke="#000" stroke-width="2.5"/>';
    stage.appendChild(s);
    setTimeout(function(){ s.remove(); }, 380);
  }

  function spawnSfx(x,y,text){
    var el=document.createElement('div');
    el.className='sfx-text'; el.textContent=text;
    el.style.left=(x+(Math.random()*80-40))+'px';
    el.style.top=(y-40+(Math.random()*40-20))+'px';
    el.style.setProperty('--rot',(Math.random()*36-18)+'deg');
    el.style.fontSize=(24+Math.random()*30)+'px';
    var c=COLORS[Math.floor(Math.random()*COLORS.length)];
    el.style.color=c; el.style.textShadow='3px 3px 0 #000, 0 0 18px '+c;
    stage.appendChild(el);
    setTimeout(function(){ el.remove(); }, 620);
  }

  function punch(x,y){
    if(dead) return;
    hits++; hitNum.textContent=hits;
    HP=Math.max(0,HP-2); hpFill.style.width=HP+'%';

    var now=Date.now();
    combo=(now-lastHit<700)?combo+1:1; lastHit=now;
    comboNum.textContent=combo; comboBox.classList.add('show');
    clearTimeout(comboTimer);
    comboTimer=setTimeout(function(){ combo=0; comboBox.classList.remove('show'); rush.classList.remove('show'); }, 700);

    var rushMode=combo>=12;
    rush.classList.toggle('show',rushMode);

    spawnImpact(x,y,rushMode&&Math.random()<.4);
    spawnSfx(x,y,SFX[Math.floor(Math.random()*SFX.length)]);
    if(rushMode){
      for(var i=0;i<2;i++){
        var r=frame.getBoundingClientRect();
        spawnImpact(r.left+Math.random()*r.width, r.top+Math.random()*r.height, Math.random()<.3);
      }
    }
    flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');

    frame.classList.remove('hurt'); void frame.offsetWidth; frame.classList.add('hurt');
    stage.classList.remove('shake','shake-hard'); void stage.offsetWidth;
    stage.classList.add(rushMode?'shake-hard':'shake');

    punchSound(rushMode);

    if(HP<=0) die();
  }

  function die(){
    dead=true;
    frame.classList.remove('hurt');
    frame.classList.add('dead');
    rush.classList.remove('show');
    document.body.classList.add('sepia');
    setTimeout(function(){ ko.classList.add('show'); tbc.classList.add('show'); }, 500);
  }

  function reset(){
    HP=100; hits=0; combo=0; dead=false;
    hpFill.style.width='100%'; hitNum.textContent='0';
    comboBox.classList.remove('show');
    frame.classList.remove('dead','hurt');
    ko.classList.remove('show'); tbc.classList.remove('show');
    document.body.classList.remove('sepia');
  }

  stage.addEventListener('pointerdown',function(e){
    hint.style.display='none';
    punch(e.clientX,e.clientY);
  });
  retry.addEventListener('click',function(e){ e.stopPropagation(); reset(); });
})();
</script>
</body>
</html>
